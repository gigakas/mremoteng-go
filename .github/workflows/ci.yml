name: CI

# Merge gate for every change (blueprint stage 4.2). The steps call the same
# scripts a developer runs locally, so a green local run predicts a green build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check + smoke (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne needs cgo plus the GL/X11 headers; the web view helper is a separate
      # binary that links GTK and WebKit, so its development packages are needed
      # to compile it even though the application itself never links them.
      - name: Install Fyne and WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: scripts/check.sh (gofmt, go vet, go test -race)
        run: ./scripts/check.sh

      - name: scripts/smoke.sh (all binaries build, version, changelog reproducible)
        run: ./scripts/smoke.sh
